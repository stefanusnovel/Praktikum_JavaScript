<html>
    <head>
        <title>Belajar Javascript Platform</title>
    </head>
    <body>
        <h1>Belajar Javascript</h1>
        <button onclick="perulangan()">TOMBOL</button>

        <div id="hasil"></div>
    <script>
        function perulangan(){
            var teks ="";
            var x;
            for(x = 0; x <= 10; x++){
                teks += "Anka" +x+"<br>";
            }
            document.getElementById("hasil").innerHTML =teks;
        }
    </script>
    </body>
</html>
