<!DOCTYPE html>
<html>
    <head>
        <title>Kalkulator Sederhana</title>
    </head>
    <body>
        <h1>Kalkulator Tambah/Kurang/Kali/Bagi</h1>

        Bilangan 1 <input type="teks" id="bil1"><br>
        Bilangan 2 <input type="teks" id="bil2"><br>

        <button onclick="tambah()">Tambah</button>
        <button onclick="kurang()">Kurang</button>
        <button onclick="kali()">Kali</button>
        <button onclick="bagi()">Bagi</button>

        Hasil <input type="teks" id="hasil">

        <script>
            function tambah(){
                var bilangan1 = document.getElementById("bil1").value;
                var bilangan2 = document.getElementById("bil2").value;
                var total = Number(bilangan1) + Number(bilangan2);
                document.getElementById("hasil").value =total;
            }

            function kurang(){
                var bilangan1 = document.getElementById("bil1").value;
                var bilangan2 = document.getElementById("bil2").value;
                var total = Number(bilangan1) - Number(bilangan2);
                document.getElementById("hasil").value =total;
            }

            function kali(){
                var bilangan1 = document.getElementById("bil1").value;
                var bilangan2 = document.getElementById("bil2").value;
                var total = Number(bilangan1) * Number(bilangan2);
                document.getElementById("hasil").value =total;
            }

            function bagi(){
                var bilangan1 = document.getElementById("bil1").value;
                var bilangan2 = document.getElementById("bil2").value;
                var total = Number(bilangan1) / Number(bilangan2);
                document.getElementById("hasil").value =total;
            }
        </script>
    </body>
</html>
