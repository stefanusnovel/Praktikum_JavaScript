<html>
    <head>
        <title>Belajar Javascript Platfrom</title>
    </head>
    <body>
        <h1>Belajar Javascript</h1>
        <!-- memberikan event pada elemen tombol -->
        <button onclick="tampilkan_nama()">KLIK SAYA</button>
        <!-- id hasil -->
        <div id="hasil"></div>

        <script>
            // membuat function tampilkan_nama
            function tampilkan_nama(){
                document.getElementById("hasil").innerHTML ="<h3>Nama Saya Adalah Novel</h3>";
            }
        </script>
    </body>
</html>
