<html>
    <head>
        <title>Belajar JavaScript Platform</title>
    </head>
    <body>
        <h1>Belajar JavaScript</h1>
        <div id="penjumlahan"></div>
        <div id="pengurangan"></div>
        <div id="perkalian"></div>
        <div id="pembagian"></div>
        <div id="modulus"></div>

        <script>
            var a = 6;
            var b = 2;
            
            var penjumlahan = a + b;
            var pengurangan = a - b;
            var perkalian = a * b;
            var pembagian = a / b;
            var modulus = a % b;

            document.getElementById("penjumlahan").innerHTML = "Penjumlahan: " + penjumlahan;
            document.getElementById("pengurangan").innerHTML = "Pengurangan: " + pengurangan;
            document.getElementById("perkalian").innerHTML = "Perkalian: " + perkalian;
            document.getElementById("pembagian").innerHTML = "Pembagian: " + pembagian;
            document.getElementById("modulus").innerHTML = "Modulus: " + modulus;
        </script>
    </body>
</html>
